name: Publish preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, 'Record Pages status') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make the repository public and enable Pages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
          VISIBILITY_PAT: ${{ secrets.VISIBILITY_PAT }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'PY' > pages-status.txt 2>&1
          import json, os, urllib.error, urllib.request

          def call(token, method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "psy-trance-pages",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode()
                      return resp.status, raw[:400]
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode()[:400]

          status, body = call(os.environ["ACTIONS_TOKEN"], "GET", "/repos/mizcausevic-dev/psy-trance-rolling-basslines/actions/secrets")
          print("secrets", status, body)
          for name in ("GH_PAT", "GH_DEPLOY_TOKEN", "VISIBILITY_PAT", "ACTIONS_TOKEN"):
              value = os.environ.get(name) or ""
              print(f"{name}: {'set' if value else 'missing'}")
              if not value:
                  continue
              print("visibility", name)
              print(call(value, "PATCH", "/repos/mizcausevic-dev/psy-trance-rolling-basslines", {"visibility": "public"}))
              print("pages", name)
              print(call(value, "POST", "/repos/mizcausevic-dev/psy-trance-rolling-basslines/pages", {"build_type": "legacy", "source": {"branch": "main", "path": "/"}}))
          PY

      - name: Record the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-status.txt
          git commit -m "Record Pages status [skip ci]"
          git push
