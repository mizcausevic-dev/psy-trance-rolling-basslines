name: Materialize pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[pages]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Repair the truncated composer tail
        run: |
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("tools/compose.py")
          data = path.read_bytes()
          good = "e7e60b55ff13e2e8c7f42bc3749af74e93569c92"
          blob = hashlib.sha1(b"blob %d\0" % len(data) + data).hexdigest()
          print("compose_blob", blob, "bytes", len(data))
          if blob == good:
              raise SystemExit(0)
          cut = 39663
          prefix_good = "4d0efefa4390ed535a3808515165cd35ebf3a8dc9b3794818652a3dc09aac1dc"
          prefix = hashlib.sha256(data[:cut]).hexdigest()
          print("prefix", prefix)
          if len(data) < cut or prefix != prefix_good:
              raise SystemExit("compose.py prefix does not match the known-good generator")
          tail = (
              b'"arrangement": arrangement,\n'
              b'        "identity_check": identity,\n'
              b'    }\n'
              b'    return {"catalog": catalog, "score": score}\n'
          )
          repaired = data[:cut] + tail
          path.write_bytes(repaired)
          blob = hashlib.sha1(b"blob %d\0" % len(repaired) + repaired).hexdigest()
          print("repaired_blob", blob, "bytes", len(repaired))
          if blob != good:
              raise SystemExit("repair did not reproduce the known composer")
          PY

      - name: Confirm generator blobs
        run: |
          python3 - << 'PY'
          import subprocess, sys
          expected = {
              "tools/compose.py": "e7e60b55ff13e2e8c7f42bc3749af74e93569c92",
              "tools/build_pack.py": "9e25b64410726095bf257c4db3507ac00ca0c3ac",
              "tools/page.py": "1c40fb9b6b09ed41356583dbcbf0d9b3a3d28880",
              "tools/midi_io.py": "a51789f7d76f439af309887dc0a6411be359e52e",
              "tools/article.py": "eb5013390b6aaa0d65af9d9872e680f198b4e2e5",
              "tools/render_audio.py": "3f26c723b34118a8422331d495d6e2cbd034dd74",
              "tools/render_visual.py": "651b10d62cea365f17f6c3796ee9c041ae63adc9",
          }
          bad = False
          for path, digest in expected.items():
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              print(path, got, "OK" if got == digest else "MISMATCH")
              bad = bad or got != digest
          if bad:
              raise SystemExit(1)
          PY

      - name: Install ffmpeg and the disclosure font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build MIDI, preview, film, and the catalog page
        run: python3 tools/build_pack.py

      - name: Commit the generated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f source.b64 build-log.txt actions-started.txt || true
          git add -A
          git commit -m "Add MIDI, preview, film, and catalog page [skip ci]"
          git push

      - name: Set topics and GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/topics" \
            -f "names[]=midi" \
            -f "names[]=psytrance" \
            -f "names[]=bassline" \
            -f "names[]=music-production" \
            -f "names[]=electronic-music" \
            -f "names[]=composition" \
            -f "names[]=general-midi" \
            -f "names[]=study-pack"
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/" \
          || gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/"
